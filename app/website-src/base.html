<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <meta name="description" content="${description}">
  <meta name="theme-color" content="#f6f6f0">
  <link rel="canonical" href="https://leanora.ai${path}">
  <meta property="og:title" content="${title}">
  <meta property="og:description" content="${description}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://leanora.ai${path}">
  <link rel="icon" href="/site-assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site-assets/site.css">
  <script src="/site-assets/site.js" defer></script>
</head>
<body class="${body_class}">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner wrap">
      <a class="wordmark" href="/" aria-label="Leanora 首页">Leanora<span aria-hidden="true">.</span></a>
      <nav class="desktop-nav" aria-label="主导航">
        ${navigation}
      </nav>
      <details class="mobile-nav">
        <summary>导航 <span aria-hidden="true">＋</span></summary>
        <nav aria-label="手机导航">${navigation}</nav>
      </details>
    </div>
  </header>
  <main id="main">${content}</main>
  <footer class="site-footer wrap">
    <div class="footer-brand"><a class="wordmark" href="/">Leanora<span aria-hidden="true">.</span></a><p>练习有迹可循，进步在日常发生。</p></div>
    <div class="footer-column"><span>探索产品</span><a href="/go/">Leanora AI · 围棋</a><a href="/fitness/">Leanora Fitness · 健身</a></div>
    <div class="footer-column"><span>帮助与隐私</span><a href="/support/">支持中心</a><a href="/privacy/">围棋隐私政策</a><a href="/fitness/privacy/">健身隐私政策</a></div>
    <div class="footer-bottom"><span>© 2026 Leanora</span><a href="/policies/">隐私中心 <span aria-hidden="true">↗</span></a></div>
  </footer>
  <dialog class="image-dialog" aria-label="产品界面大图">
    <div class="dialog-toolbar"><p id="image-caption"></p><button type="button" data-close-dialog aria-label="关闭大图">关闭 <span aria-hidden="true">×</span></button></div>
    <img id="dialog-image" alt="">
  </dialog>
</body>
</html>
